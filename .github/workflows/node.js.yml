# Clean install, build, and publish the static site to the dist branch.
name: Node.js CI

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build production site
        env:
          VITE_J2AGENT_API_KEY: ${{ secrets.VITE_J2AGENT_API_KEY }}
          VITE_J2AGENT_BACKEND_URL: https://j2agent.jerryt92.top
          VITE_J2AGENT_KB_COLLECTION: kb_j2agent_docs
        run: npm run build
      - name: Deploy to dist branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./dist
          commit_message: Deploy to dist branch - ${{ github.sha }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
